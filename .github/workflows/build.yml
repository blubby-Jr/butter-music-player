name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  # Update when a new VerX.Y.Z project folder becomes the current one.
  PROJECT_DIR: Ver0.2.0

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ButterMusicPlayer-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
